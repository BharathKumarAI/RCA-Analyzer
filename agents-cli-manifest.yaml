schema_version: "1.0"
name: "rca-analyzer"
version: "1.0.0"
description: "Enterprise Agent Platform for Autonomous Root Cause Analysis and Incident Triage"

runtime:
  framework: "google-adk"
  entrypoint: "app.agent:root_agent"
  python_version: "3.11"

environment_variables:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
  MLFLOW_TRACKING_URI: "http://localhost:5000"

deployment:
  default_target: "agent-runtime"
  targets:
    agent-runtime:
      region: "us-central1"
    cloud-run:
      cpu: 2
      memory: "4Gi"
      min_instances: 1
      max_instances: 10
