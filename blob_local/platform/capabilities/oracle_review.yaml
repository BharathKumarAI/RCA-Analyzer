id: oracle_review
version: 1.0.0
enabled: true
name: Oracle Session Review
description: Read the current Oracle session wait snapshot for the configured database
  username. Explain blocking sessions and wait classes. This snapshot cannot establish
  historic contention. No arbitrary SQL is available.
category: investigation
agent_stages:
- evidence
skills:
- oracle-review
requires:
  connectors:
  - oracle
permissions:
  minimum_role: PROJECT_ANALYST
  allowed_roles:
  - PLATFORM_ADMIN
  - PROJECT_OWNER
  - PROJECT_ANALYST
  allowed_actions:
  - oracle.read_evidence
safety_profile:
  tool_mutations: forbidden
  pii_access: redacted
  raw_payload_access: restricted
model_profile: balanced-investigation
