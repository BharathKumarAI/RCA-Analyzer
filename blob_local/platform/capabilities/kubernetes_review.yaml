id: kubernetes_review
version: 1.0.0
enabled: true
name: Kubernetes Health Review
description: Read pod status in the configured Kubernetes namespace. Identify unhealthy
  conditions, restart counts and scheduling failures from returned status. Never read
  secrets, execute in containers or modify workloads.
category: investigation
agent_stages:
- evidence
skills:
- kubernetes-review
requires:
  connectors:
  - kubernetes
permissions:
  minimum_role: PROJECT_ANALYST
  allowed_roles:
  - PLATFORM_ADMIN
  - PROJECT_OWNER
  - PROJECT_ANALYST
  allowed_actions:
  - kubernetes.read_evidence
safety_profile:
  tool_mutations: forbidden
  pii_access: redacted
  raw_payload_access: restricted
model_profile: balanced-investigation
