id: database_rca
version: 1.4.0
enabled: false
name: "Database Contention & Query RCA"
description: "Diagnoses read-only database latency, lock contention, active sessions, and slow execution plans."
category: investigation

skills:
  - database-rca

requires:
  connectors:
    - database_query

optional:
  connectors:
    - metrics

permissions:
  minimum_role: PROJECT_ANALYST
  allowed_roles:
    - PLATFORM_ADMIN
    - PROJECT_OWNER
    - PROJECT_ANALYST
  allowed_actions:
    - database.query_readonly

safety_profile:
  tool_mutations: forbidden
  pii_access: project_scoped
  raw_payload_access: restricted

model_profile: balanced-investigation
