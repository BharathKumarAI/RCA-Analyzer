id: qtest_review
version: 1.0.0
enabled: true
name: Test Run Review
description: Read root-level qTest runs from the configured project. Distinguish test
  definitions from execution results. Do not claim nested runs were searched; report
  coverage limits.
category: investigation
agent_stages:
- evidence
skills:
- qtest-review
requires:
  connectors:
  - qtest
permissions:
  minimum_role: PROJECT_ANALYST
  allowed_roles:
  - PLATFORM_ADMIN
  - PROJECT_OWNER
  - PROJECT_ANALYST
  allowed_actions:
  - qtest.read_evidence
safety_profile:
  tool_mutations: forbidden
  pii_access: redacted
  raw_payload_access: restricted
model_profile: balanced-investigation
