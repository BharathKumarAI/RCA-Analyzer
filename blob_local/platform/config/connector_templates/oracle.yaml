type: oracle
name: Oracle Database
system_name: oracle
category: Database
description: Read the current Oracle session wait snapshot for the configured database
  username. Explain blocking sessions and wait classes. This snapshot cannot establish
  historic contention. No arbitrary SQL is available.
integration_kind: native
protocol: Oracle Net
auth_method: Database Credentials
version: 1.0.0
availability: published
platform_enabled: true
is_enabled_by_policy: true
provider_adapter_id: oracle
supported_operations:
- read_evidence
known_limitations:
- Thin mode and an explicit tcp[s]://host:port/service DSN are required.
- A read-only account must have SELECT access to V_$SESSION; resource scope selects one database username.
- No arbitrary SQL, table exploration, or live database mutations.
auth_profiles:
- id: database_password
  name: Read-only Database Credentials
  status: active
  transport_compatibility: Oracle Net
  required_fields:
  - database_username
  - password_secret_ref
  optional_fields: []
  hidden_fields: []
default_endpoint: tcp://<ORACLE_HOST>:1521/<SERVICE_NAME>
default_secret: env://ORACLE_PASSWORD
default_scope: platform_default
default_config:
  environment_scoped: true
parameter_fields:
- variable_name: system_name
  label: System Name
  description: Project-defined connector instance name. Defaults to the connector name and remains editable.
  value_type: string
  default_value: Oracle Database
  required: true
  allow_project_override: true
  visible_in_project: true
  ownership: project_only
  category: operational
  icon: tag
- variable_name: environment_dependency
  label: Environment Dependent/Independent
  description: Explicit project choice between Environment Dependent (environment
    mappings) and Environment Independent (shared external system).
  value_type: string
  default_value: independent
  required: true
  allowed_values:
  - dependent
  - independent
  allow_project_override: true
  visible_in_project: true
  ownership: project_only
  category: operational
  icon: layers
- variable_name: tool_environment
  label: Tool Environment
  description: Authorized external environment name (e.g. Shared for independent,
    or target tool environment).
  value_type: string
  default_value: Shared
  required: true
  required_when: environment_dependency == 'dependent'
  allow_project_override: true
  visible_in_project: true
  ownership: project_only
  category: operational
  icon: globe
- variable_name: driver_mode
  label: Oracle Driver Mode
  description: Asynchronous Thin mode uses python-oracledb without local Oracle Client libraries.
  value_type: string
  default_value: thin
  allowed_values:
  - thin
  allow_project_override: true
  visible_in_project: true
  ownership: project_only
  category: connectivity
  subcategory: protocol
  icon: database
  runtime_binding: oracle.driver_mode
- variable_name: connection_format
  label: Oracle Connection Format
  description: Explicit Easy Connect DSN with one host, port and service; TNS aliases and connection descriptors are unavailable.
  value_type: string
  default_value: dsn
  allowed_values:
  - dsn
  allow_project_override: true
  visible_in_project: true
  ownership: project_only
  category: connectivity
  subcategory: protocol
  icon: link
  runtime_binding: oracle.connection_format
