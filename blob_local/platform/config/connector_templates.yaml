- type: itsm
  name: Jira Cloud Incident Triage
  system_name: itsm
  category: Ticketing
  description: Read-only Jira ticket lookup, comment fetch, and structured fields
    extraction for incident workflows.
  integration_kind: native
  protocol: HTTPS
  auth_method: Basic API Token
  version: 1.0.0
  availability: published
  platform_enabled: true
  is_enabled_by_policy: true
  provider_adapter_id: itsm
  supported_operations:
  - get_ticket
  known_limitations:
  - Read-only ticket lookup; comment writes and issue mutations are unsupported.
  - Native provider appends /rest/api/2/issue/{id}.
  - JQL queue search requires backend search extension.
  auth_profiles:
  - id: basic_api_token
    name: Basic Authentication (Email + API Token)
    status: active
    transport_compatibility: HTTPS
    required_fields:
    - account_identifier
    - api_token_secret_ref
    optional_fields: []
    hidden_fields:
    - password_secret_ref
    - domain
  - id: oauth2_client_credentials
    name: OAuth 2.0 Client Credentials (Planned)
    status: planned
    transport_compatibility: HTTPS
    required_fields:
    - oauth_provider_profile
    - client_id
    - client_secret_ref
    optional_fields:
    - audience
    - scopes
    hidden_fields:
    - api_token_secret_ref
  default_endpoint: https://<JIRA_WORKSPACE>.atlassian.net
  default_ui_base_url: https://<JIRA_WORKSPACE>.atlassian.net
  default_secret: env://JIRA_API_TOKEN
  default_service_user: triage-bot@organization.internal
  default_scope: platform_default
  can_override: true
  default_timeout_seconds: 30
  default_retry_attempts: 3
  default_retry_backoff: 5
  default_rate_limit: 100 req/min
  default_config:
    project_key: ''
    timezone: UTC
    polling_frequency: ''
  parameter_fields:
  - variable_name: system_name
    label: System Name
    description: Project-defined connector instance name. Defaults to the connector name and remains editable.
    value_type: string
    default_value: Jira Cloud Incident Triage
    required: true
    allow_project_override: true
    visible_in_project: true
    ownership: project_only
    category: operational
    icon: tag
  - variable_name: environment_dependency
    label: Environment Dependent/Independent
    description: Explicit project choice between Environment Dependent (environment
      mappings) and Environment Independent (shared external system).
    value_type: string
    default_value: independent
    required: true
    allowed_values:
    - dependent
    - independent
    allow_project_override: true
    visible_in_project: true
    ownership: project_only
    category: operational
    icon: layers
  - variable_name: tool_environment
    label: Tool Environment
    description: Authorized external environment name (e.g. Shared for independent,
      or target tool environment).
    value_type: string
    default_value: Shared
    required: true
    required_when: environment_dependency == 'dependent'
    allow_project_override: true
    visible_in_project: true
    ownership: project_only
    category: operational
    icon: globe
  - variable_name: custom_field_mapping
    label: Jira Custom Field Mapping
    description: Verified Jira field IDs and project display mappings used when extracting issue evidence.
    value_type: json
    default_value: {}
    allow_project_override: true
    visible_in_project: true
    ownership: project_only
    category: query
    subcategory: field_mapping
    icon: list
    runtime_binding: jira.custom_field_mapping
  - variable_name: attachment_processing
    label: Attachment Processing
    description: Process files supplied through the project attachment service; Jira-hosted attachment downloads are not enabled.
    value_type: string
    default_value: disabled
    allowed_values:
    - disabled
    - local_upload
    allow_project_override: true
    visible_in_project: true
    ownership: project_only
    category: operational
    icon: paperclip
    runtime_binding: project.attachment_processing
