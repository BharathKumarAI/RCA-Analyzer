- type: itsm
  name: Jira Cloud Incident Triage
  system_name: itsm
  category: Ticketing
  description: Read-only Jira ticket lookup, comment fetch, and structured fields extraction for incident workflows.
  integration_kind: native
  protocol: HTTPS
  auth_method: Bearer Token
  default_endpoint: https://atlassian.net/rest/api/3
  default_ui_base_url: https://atlassian.net
  default_secret: JIRA_API_TOKEN
  default_service_user: triage-bot@organization.com
  default_scope: platform_default
  can_override: true
  default_timeout_seconds: 30
  default_retry_attempts: 3
  default_retry_backoff: 5
  default_rate_limit: 100 req/min
  default_config:
    project_key: SAG
    timezone: America/Chicago
    polling_frequency: Every 15 minutes

- type: log_search
  name: Splunk Infrastructure & Log Mining
  system_name: log_search
  category: Observability
  description: Bounded read-only log search, saved search execution, and event correlation for incident triage.
  integration_kind: native
  protocol: HTTPS
  auth_method: Bearer Token
  default_endpoint: https://splunk-api.prod.internal:8089
  default_ui_base_url: https://splunk-ui.prod.internal:8000
  default_secret: SPLUNK_TOKEN
  default_service_user: splunk-api-svc@internal
  default_scope: platform_default
  can_override: true
  default_timeout_seconds: 30
  default_retry_attempts: 3
  default_retry_backoff: 5
  default_rate_limit: 120 req/min
  default_config:
    allowed_indexes:
      - adms
      - billing
      - system
    max_results: 100
    max_window_seconds: 86400

