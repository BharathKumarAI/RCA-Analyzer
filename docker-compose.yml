services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make db-deploy first}
      POSTGRES_DB: ${POSTGRES_DB:-rca_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.runtime
    environment:
      RCA_DATABASE_URL: ${RCA_DOCKER_DATABASE_URL:?Run make db-deploy first}
      RCA_SESSION_DATABASE_URL: ${RCA_DOCKER_DATABASE_URL:?Run make db-deploy first}
      RCA_DATABASE_CONFIGURATION: "true"
      RCA_OPTIMIZATION_TRACKING_URI: ${RCA_DOCKER_TRACKING_URI:?Run make db-deploy first}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./blob_local/platform:/app/blob_local/platform:ro
      - ./blob_local/projects:/app/blob_local/projects
      - agent_config_blobs:/app/blob_local/agent-configurations
      - optimization_blobs:/app/blob_local/optimizations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  agent_config_blobs:
  optimization_blobs:
