[project]
name = "rca-analyzer"
version = "0.1.0"
description = "Governed root cause analysis API built on Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.9.0",
    "httpx2>=2.12.0,<3",
    "mlflow>=3.16.0,<4",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "pydantic>=2.10.0,<3",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2.0.0,<3",
    "aiosqlite>=0.20.0,<1",
    "asyncpg>=0.30.0,<1",
    "PyJWT[crypto]>=2.10.0,<3",
    "Pillow>=11.0.0,<13",
    "pypdf>=5.0.0,<7",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.1.0,<4",
    "python-multipart>=0.0.20,<1",
    "google-cloud-storage>=3.0.0,<4",
    "opentelemetry-api>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.25.0,<2",
    "ruff>=0.9.0,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
